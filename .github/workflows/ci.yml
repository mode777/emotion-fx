name: ci

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Version token embedded in the downloadable archives: the tag name on
# tag runs, and a SHA-derived development token on manual runs (ADR 0023).
env:
  EFX_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  diag-captures:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSOKOL_DEBUG_LOG=ON
      - name: Build player
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --config Release --target player -j4
          else
            cmake --build build --target player -j4
          fi
      - name: Diagnostic capture matrix
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PLAYER=build/Release/player.exe; else PLAYER=build/player; fi
          mkdir -p diag
          for combo in "0_1_0_0_0_0" "0_1_0_0_1_0" "0_1_0_0_0_1" "1_1_0_0_1_0" "0_1_1_0_0_1" "0_0_0_1_0_0" "0_1_0_1_1_0"; do
            IFS=_ read nocull noremap nodepth noib posonly u16 <<< "$combo"
            tag="cul${nocull}_rem${noremap}_dep${nodepth}_ib${noib}_po${posonly}_u16${u16}"
            export EFX_DIAG_NOCULL=$nocull EFX_DIAG_NOREMAP=$noremap EFX_DIAG_NODEPTH=$nodepth EFX_DIAG_NOIB=$noib EFX_DIAG_POSONLY=$posonly EFX_DIAG_U16=$u16
            for scene in cube3d depth3d surfaces3d; do
              "$PLAYER" --capture-frame 2 --capture-output "diag/${scene}-${tag}.png" tests/goldens/$scene || echo "capture failed: $scene $tag"
            done
          done
      - name: Upload diagnostic captures
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.os }}
          path: diag/

  native:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # deterministic rendering for the golden jobs (ADR 0020)
      EMSDK_VERSION: 3.1.64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -DEFX_BUILD_DEV_HARNESS=ON -DEFX_BUILD_GOLDEN_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke + unit + golden tests (Linux, software GL)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

      - name: Smoke + unit + golden tests (Windows WARP / macOS GPU)
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload golden failure artifacts
        if: failure() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: build/goldens/

      - name: Package player archive (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          name="emotion-fx-${EFX_VERSION}-${{ runner.os }}-${{ runner.arch }}"
          mkdir -p dist
          cp build/player "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm "dist/$name"

      - name: Package player archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "emotion-fx-$env:EFX_VERSION-windows-${{ runner.arch }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/player.exe "dist/$name.exe"
          Compress-Archive -Path "dist/$name.exe" -DestinationPath "dist/$name.zip"
          Remove-Item "dist/$name.exe"

      - name: Upload player artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: player-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload player artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: player-windows-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error

  emscripten:
    name: build+test (emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.64' # pinned — ADR 0020 CI determinism

      - name: Configure
        run: emcmake cmake -B build-em -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-em

      - name: Smoke tests (headless under Node, native bridge)
        run: ctest --test-dir build-em --output-on-failure

      - name: Install Linux window dependencies (native comparison baseline)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      - name: Build native player (desktop quickjs baseline)
        run: |
          cmake -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --target player

      - name: Cross-runtime comparison smoke test
        run: node tools/run_web_compare.mjs
        env:
          NATIVE_PLAYER: build-native/player
          WEB_PLAYER_BUILD: build-em

      - name: Package web player bundle
        run: |
          set -euo pipefail
          name="emotion-fx-${EFX_VERSION}-web"
          for f in player_web.html player_web.js player_web.wasm player_web.data; do
            test -f "build-em/$f" || { echo "missing build-em/$f" >&2; exit 1; }
          done
          mkdir -p "dist/$name"
          cp build-em/player_web.html build-em/player_web.js build-em/player_web.wasm build-em/player_web.data "dist/$name/"
          (cd dist && zip -r "$name.zip" "$name")

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-emscripten-web
          path: dist/*.zip
          if-no-files-found: error

  golden-web:
    name: golden tests (emscripten / headless chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.64' # pinned — ADR 0020 CI determinism

      - name: Configure capture build (Emscripten)
        run: emcmake cmake -B build-web-golden -DEFX_BUILD_GOLDEN_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build capture player
        run: |
          cmake --build build-web-golden --target player_web_golden
          ls -la build-web-golden

      - name: Configure native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev
          cmake -B build-golden-tools -DEFX_BUILD_GOLDEN_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build comparator
        run: cmake --build build-golden-tools --target efx_imgdiff

      - name: Install pinned Chrome (major-version pin)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: '131'

      - name: Install driver dependencies + headless shell
        run: |
          npm install --no-save puppeteer-core @puppeteer/browsers
          npx @puppeteer/browsers install chrome-headless-shell@131 --path "$HOME/browsers"
          echo "CHROME_SHELL_PATH=$(find "$HOME/browsers" -name chrome-headless-shell -type f | head -1)" >> "$GITHUB_ENV"

      - name: Golden tests via headless Chrome (SwiftShader WebGL)
        run: node tools/run_web_goldens.mjs
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Browser runtime harness (boot, hooks, errors, exit codes)
        run: node tools/run_web_harness.mjs
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  generate-goldens:
    name: generate golden images (manual bootstrap)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev xvfb

      - name: Configure + build (golden capture)
        run: |
          cmake -B build -DEFX_BUILD_GOLDEN_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target player

      - name: 'Capture golden images (canonical - Linux llvmpipe)'
        run: |
          for scene in clear solid srcrect pivot blend camera; do
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
              ./build/player --capture-frame 2 \
                --capture-output tests/goldens/$scene/golden.png tests/goldens/$scene
          done

      - name: Upload goldens artifact
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: tests/goldens/*/golden.png

  release:
    name: attach release assets
    needs: [native, emscripten]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all target archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: player-*
          merge-multiple: true

      - name: Create or update release and attach archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
