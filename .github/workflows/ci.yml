name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DEFX_BUILD_DEV_HARNESS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke tests
        run: ctest --test-dir build -C Release --output-on-failure

  emscripten:
    name: build+test (emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure
        run: emcmake cmake -B build-em -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-em

      - name: Smoke tests (headless under Node)
        run: ctest --test-dir build-em --output-on-failure
