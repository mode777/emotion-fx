name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DEFX_BUILD_DEV_HARNESS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke tests
        run: ctest --test-dir build -C Release --output-on-failure

  emscripten:
    name: build+test (emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure
        run: emcmake cmake -B build-em -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-em

      - name: Smoke tests (headless under Node)
        run: ctest --test-dir build-em --output-on-failure

  pages:
    name: deploy web player (github pages)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build web player
        run: |
          emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --target player_web

      - name: Collect pages content
        run: |
          mkdir pages
          cp build-web/player_web.html pages/index.html
          cp build-web/player_web.js build-web/player_web.wasm build-web/player_web.data pages/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
